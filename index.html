<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نقاء الماء & عين الصقر | مياه نقية وأمان متكامل</title>
    <!-- استدعاء خط Cairo الفخم -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;900&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #0284c7;
            --primary-dark: #0369a1;
            --secondary: #0f172a;
            --accent: #38bdf8;
            --light: #f8fafc;
            --gray: #64748b;
            --white: #ffffff;
            --transition: all 0.3s ease;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Cairo', sans-serif;
            scroll-behavior: smooth;
        }

        body {
            background-color: var(--light);
            color: var(--secondary);
            line-height: 1.6;
        }

        /* الهيدر المحدث ليتناسب مع الموبايل */
        header {
            background: rgba(15, 23, 42, 0.98);
            backdrop-filter: blur(10px);
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            z-index: 1000;
            box-shadow: 0 4px 20px rgba(0,0,0,0.15);
        }

        .header-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 10px 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
        }

        .logo-icon {
            width: 38px;
            height: 38px;
            background: linear-gradient(135deg, var(--primary), var(--accent));
            border-radius: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            color: var(--white);
            font-size: 18px;
        }

        .logo-text h1 {
            color: var(--white);
            font-size: 15px;
            font-weight: 700;
            line-height: 1.2;
        }

        .logo-text span {
            color: var(--accent);
            font-size: 11px;
        }

        nav {
            display: flex;
            gap: 15px;
        }

        nav a {
            color: var(--white);
            text-decoration: none;
            font-weight: 600;
            font-size: 14px;
            transition: var(--transition);
        }

        nav a:hover {
            color: var(--accent);
        }

        .cta-btn {
            background: linear-gradient(135deg, #25d366, #128c7e);
            color: var(--white);
            padding: 8px 14px;
            border-radius: 50px;
            text-decoration: none;
            font-weight: 700;
            font-size: 13px;
            display: flex;
            align-items: center;
            gap: 6px;
            white-space: nowrap;
            box-shadow: 0 4px 12px rgba(37, 211, 102, 0.3);
        }

        /* الهيرو */
        .hero {
            background: linear-gradient(rgba(15, 23, 42, 0.85), rgba(15, 23, 42, 0.9)), url('hero-banner.png') center/cover no-repeat;
            min-height: 85vh;
            display: flex;
            align-items: center;
            text-align: center;
            padding: 130px 20px 60px;
            color: var(--white);
        }

        .hero-content {
            max-width: 800px;
            margin: 0 auto;
        }

        .badge {
            background: rgba(56, 189, 248, 0.15);
            color: var(--accent);
            padding: 5px 14px;
            border-radius: 30px;
            font-size: 13px;
            font-weight: 600;
            display: inline-block;
            margin-bottom: 15px;
            border: 1px solid rgba(56, 189, 248, 0.3);
        }

        .hero h2 {
            font-size: 32px;
            font-weight: 900;
            margin-bottom: 15px;
            line-height: 1.3;
        }

        .hero h2 span {
            color: var(--accent);
        }

        .hero p {
            font-size: 16px;
            color: #cbd5e1;
            margin-bottom: 25px;
        }

        .hero-buttons {
            display: flex;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .btn-primary {
            background: var(--primary);
            color: var(--white);
            padding: 12px 24px;
            border-radius: 10px;
            text-decoration: none;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
        }

        .btn-outline {
            background: transparent;
            color: var(--white);
            border: 2px solid rgba(255,255,255,0.2);
            padding: 12px 24px;
            border-radius: 10px;
            text-decoration: none;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
        }

        /* الأقسام العامة */
        section {
            padding: 70px 20px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .section-header {
            text-align: center;
            margin-bottom: 40px;
        }

        .section-header span {
            color: var(--primary);
            font-weight: 700;
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 2px;
            display: block;
            margin-bottom: 8px;
        }

        .section-header h3 {
            font-size: 26px;
            font-weight: 800;
            color: var(--secondary);
        }

        /* شبكة البطاقات والصور المنضبطة تماماً */
        .grid-3 {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 25px;
        }

        .card {
            background: var(--white);
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 8px 25px rgba(0,0,0,0.06);
            border: 1px solid #e2e8f0;
            display: flex;
            flex-direction: column;
        }

        .card-img-container {
            width: 100%;
            height: 200px;
            background: #f1f5f9;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .card-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center;
        }

        .card-body {
            padding: 20px;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
            justify-content: space-between;
        }

        .card h4 {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 10px;
            color: var(--secondary);
        }

        .card p {
            color: var(--gray);
            font-size: 14px;
            margin-bottom: 20px;
        }

        .card-link {
            color: var(--primary);
            text-decoration: none;
            font-weight: 700;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        /* بانر الشركة */
        .banner-showcase {
            width: 100%;
            max-width: 1200px;
            margin: 20px auto;
            padding: 0 20px;
        }

            width: 100%;
            height: auto;

            display: block;
